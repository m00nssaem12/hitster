  #life-container { font-family: 'Black Han Sans', sans-serif; font-size: 1.5rem; color: #FFD700; margin-bottom: 10px; }
  #warn-banner { display: none; background: #e74c3c; color: #fff; padding: 10px 14px; border-radius: 8px; margin: 6px auto 10px; max-width: 500px; font-weight: 700; font-size: 0.9rem; word-break: keep-all; }
  .btn-group { position: sticky; top: 0; background: #2C3E50; padding: 10px; z-index: 1000; display: flex; justify-content: center; gap: 8px; border-bottom: 2px solid #34495E; }
  .btn-group button { background: #FFD700; color: #000; border: none; padding: 10px 15px; border-radius: 8px; font-weight: 800; font-size: 0.9rem; cursor: pointer; box-shadow: 0 3px #b89b00; }

  .reset-btn { background: #e74c3c !important; color: #fff !important; box-shadow: 0 3px #c0392b !important; }
  #sortable-list { padding: 15px; max-width: 500px; margin: 10px auto 100px; background: #1a252f; border-radius: 15px; border: 2px dashed #FFD700; min-height: 100px; }
  .card { background: #34495E; border: 2px solid #FFD700; padding: 10px; border-radius: 12px; margin-bottom: 10px; display: flex; align-items: center; position: relative; touch-action: none; }

  .play-btn { background: #FFD700; color: #000; border: none; padding: 10px 14px; border-radius: 8px; font-weight: bold; font-size: 0.9rem; z-index: 10; flex-shrink: 0; box-shadow: 0 3px #b89b00; cursor: pointer; }
  .info-text { flex: 1; text-align: left; margin-left: 12px; font-weight: 700; font-size: 1rem; pointer-events: none; word-break: keep-all; }
  .year-tag { background: #FFD700; color: #000; padding: 5px 10px; border-radius: 6px; font-weight: 900; font-size: 1rem; display: none; margin-left: 5px; }
  .card.revealed .year-tag { display: block !important; }
  .card.correct { background: #27ae60 !important; border-color: #2ecc71 !important; }
  .card.wrong { background: #9b59b6 !important; border-color: #8e44ad !important; }
  .blind-box { position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; background: #000; border-top: 3px solid #FFD700; z-index: 9999; display: flex; align-items: center; justify-content: center; }

  #player-wrapper { position: fixed; bottom: 0; left: 0; width: 200px; height: 200px; opacity: 0.01; pointer-events: none; z-index: 1; }

  #check-panel { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.96); z-index: 10002; overflow-y: auto; padding: 20px; }

  #check-panel button:disabled { opacity: 0.5; }

  .chk-row { padding: 7px 8px; border-bottom: 1px solid #34495E; font-size: 0.85rem; white-space: pre-wrap; }
  .chk-ok { color: #55efc4; }

  .chk-warn { color: #ffeaa7; font-weight: 700; }

  }

  // 6초 안에 재생이 시작되지 않으면 (주로 휴대폰 자동재생 차단) 다시 누르라고 안내
  function armTimer(card) {
    clearTimeout(playTimer);
    playTimer = setTimeout(() => {
      if (currentCard !== card) return;
      if (player.getPlayerState() !== YT.PlayerState.PLAYING) {
        btnOf(card).innerText = '🎧 다시 재생';
        onAirText.innerText = '👆 재생이 막혔어요. 버튼을 한 번 더 눌러주세요';
      }
    }, 6000);
  }

  function handlePlay(card) {
    if (!playerReady) return alert("유튜브 플레이어가 아직 준비되지 않았습니다. 잠시만 기다려주세요.");
    const btn = btnOf(card);

    // 같은 카드를 다시 누른 경우
    if (currentCard === card) {
      const st = player.getPlayerState();
      if (st === YT.PlayerState.PLAYING || st === YT.PlayerState.BUFFERING) {
        stopPlayback();
        return;
      }
      // 불러왔는데 막혀 있던 경우 → 이번 터치로 다시 재생 시도
      player.unMute();
      player.playVideo();
      btn.innerText = '✖ 정지';
      onAirText.innerText = '⏳ 불러오는 중...';
      armTimer(card);
      return;
    }

    if (currentCard) btnOf(currentCard).innerText = '🎧 재생';
    currentCard = card;
    player.unMute();
    player.setVolume(100);
    player.loadVideoById(card.song.l);
    btn.innerText = '✖ 정지';
    onAirText.innerText = '⏳ 불러오는 중...';
    armTimer(card);
  }

  function onPlayerState(e) {
    if (checking) {
      if (e.data === YT.PlayerState.PLAYING) finishCheck('ok');
      return;
    }
    if (!currentCard) return;
    if (e.data === YT.PlayerState.PLAYING) {
      clearTimeout(playTimer);
      currentCard.dataset.heard = '1';
      btnOf(currentCard).innerText = '✖ 정지';
      onAirText.innerText = '📻 NOW PLAYING...';
    } else if (e.data === YT.PlayerState.ENDED) {
      stopPlayback();
    }
  }

  function onPlayerError(e) {
    if (checking) { finishCheck('err', e.data); return; }

    const card = currentCard;
    stopPlayback();
    if (!card) return;

    if (e.data === 153) {
      onAirText.innerText = '🚫 유튜브 설정 오류(153): 인터넷 주소로 열어주세요';
      return;
    }

    // 오류코드 5는 보통 일시적인 오류라, 같은 곡으로 한 번만 재시도해봄
    if (e.data === 5 && card.dataset.retried !== '1') {
      card.dataset.retried = '1';
      currentCard = card;
      player.unMute();
      player.setVolume(100);
      player.loadVideoById(card.song.l);
      btnOf(card).innerText = '✖ 정지';
      onAirText.innerText = '⏳ 다시 불러오는 중...';
      armTimer(card);
      return;
    }

    badIds.add(card.song.l);
    persistBadIds();
    console.warn('재생 불가:', card.song.t, '-', card.song.a, card.song.l, '오류코드', e.data);

    if (card.classList.contains('revealed')) {
      onAirText.innerText = '🚫 이 곡은 재생할 수 없어요';
      return;
    }

    // 아직 정답 공개 전이면 다른 곡으로 조용히 교체 (라이프 손해 없음)
    const next = drawSong();
    if (!next) {
      onAirText.innerText = '🚫 재생 가능한 곡이 더 없어요';
      return;
    }
    setCardSong(card, next);
    onAirText.innerText = '🔁 재생 안 되는 곡이라 다른 곡으로 바꿨어요. 다시 눌러주세요!';
  }

  // ─── 게임 ───
  new Sortable(list, { 
    animation: 250, 
    handle: '.drag-handle'
  });

  function drawSong() {
    while (songData.length) {
      const s = songData.splice(Math.floor(Math.random() * songData.length), 1)[0];
      if (!badIds.has(s.l)) return s;
    }
    return null;
  }

  function setCardSong(card, song) {
    card.song = song;
    card.dataset.year = song.y;
    card.dataset.heard = '0'; // 이 곡으로는 아직 (재)생 성공한 적 없음
    card.dataset.retried = '0'; // 이 곡으로는 아직 재시도 안 함
    card.querySelector('.year-tag').innerText = song.y;
  }

  function updateUI() {
    document.getElementById('life-container').innerText = `LIVES: ${'❤️'.repeat(Math.max(0, lives))}`;
    if (lives <= 0) document.getElementById('game-over-screen').style.display = 'flex';
    addBtn.disabled = !!document.querySelector('.card:not(.revealed)');
  }

  function addCard() {
    if (document.querySelector('.card:not(.revealed)')) return alert("정답을 먼저 확인해주세요!");
    const song = drawSong();
    if (!song) return alert("모든 카드를 사용했습니다!");

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="drag-handle"></div>
      <button class="play-btn">🎧 재생</button>
      <span class="info-text">? ? ? - ? ? ?</span>
      <span class="year-tag"></span>
    `;
    setCardSong(card, song);

    btnOf(card).onclick = (e) => {
      e.stopPropagation();
      handlePlay(card);
    };

    card.onclick = () => checkAnswer(card);
    list.appendChild(card);
    updateUI();
  }

  function checkAnswer(card, force) {
    if (card.classList.contains('revealed') || lives <= 0) return;
    if (!force && card.dataset.heard !== '1') {
      onAirText.innerText = '🎧 아직 이 곡을 못 들었어요! 재생 버튼을 눌러 듣고 나서 카드를 눌러주세요';
      return;
    }
    const all = Array.from(document.querySelectorAll('.card'));
    const idx = all.indexOf(card);
    const yr = parseInt(card.dataset.year);
    const years = all.map(c => parseInt(c.dataset.year));

    let ok = true;
    for (let i = 0; i < idx; i++) if (years[i] > yr) ok = false;
    for (let i = idx + 1; i < years.length; i++) if (years[i] < yr) ok = false;

    card.classList.add('revealed');
    card.querySelector('.info-text').innerText = `${card.song.a} - ${card.song.t}`;

    if (ok) {
      card.classList.add('correct');
    } else {
      card.classList.add('wrong');
      lives--;
      updateUI();
      setTimeout(() => {
        if (currentCard === card) stopPlayback();
        card.remove();
        updateUI();
      }, 1200);
    }
    updateUI();
  }

  addBtn.onclick = addCard;
  document.getElementById('reveal-all-btn').onclick = () => document.querySelectorAll('.card').forEach(c => checkAnswer(c, true));
  document.getElementById('reset-btn').onclick = () => location.reload();
  document.getElementById('retry-btn').onclick = () => location.reload();
  updateUI();

  // ─── 곡 점검 모드: 주소 끝에 ?check 를 붙여서 열면 나타남 ───
  function errText(c) {
    if (c === 100) return '영상 없음/비공개 (100)';
    if (c === 101 || c === 150) return '퍼가기(임베드) 금지 (150)';
    if (c === 2) return '잘못된 영상 ID (2)';
    if (c === 5) return '재생기 오류 (5)';
    if (c === 153) return '유튜브 설정 오류 (153) - 파일로 열었는지 확인';
    return '오류 ' + c;
  }

  function testVideo(id) {
    return new Promise(resolve => {
      checkDone = resolve;
      checkTimer = setTimeout(() => finishCheck('timeout'), 12000);
      player.loadVideoById(id);
    });
  }

  function finishCheck(status, code) {
    if (!checkDone) return;
    clearTimeout(checkTimer);
    const done = checkDone;
    checkDone = null;
    let title = '';
    if (status === 'ok') {
      try { title = player.getVideoData().title || '(제목 없음)'; } catch (err) { title = '(제목 확인 불가)'; }
    }
    player.stopVideo();
    setTimeout(() => done({ status, code, title }), 300);
  }

  async function runCheck() {
    const startBtn = document.getElementById('check-start');
    const progress = document.getElementById('check-progress');
    const out = document.getElementById('check-results');
    startBtn.disabled = true;
    stopPlayback();
    checking = true;
    player.mute();
    out.innerHTML = '';
    let badCount = 0;

    for (let i = 0; i < initialSongData.length; i++) {
      const s = initialSongData[i];
      progress.innerText = `점검 중... ${i + 1} / ${initialSongData.length}`;
      const r = await testVideo(s.l);
      const row = document.createElement('div');
      row.className = 'chk-row';
      const label = `${s.t} - ${s.a}  [${s.l}]`;
      if (r.status === 'ok') {
        row.classList.add('chk-ok');
        row.innerText = `✅ ${label}\n     ↳ 실제 영상 제목: ${r.title}`;
        out.appendChild(row);
      } else {
        badCount++;
        if (r.status === 'err') { badIds.add(s.l); persistBadIds(); }
        row.classList.add(r.status === 'err' ? 'chk-bad' : 'chk-warn');
        row.innerText = r.status === 'err'
          ? `❌ ${label} → ${errText(r.code)}`
          : `⏱ ${label} → 응답 없음 (시간 초과)`;
        out.prepend(row);
      }
    }

    player.stopVideo();
    player.unMute();
    checking = false;
    startBtn.disabled = false;
    progress.innerText = `점검 완료! 문제 있는 곡 ${badCount}개 (맨 위 빨간/노란 줄) 중 ❌ 표시된 곡은 앞으로 게임에서 자동으로 제외됩니다. 초록 줄도 '실제 영상 제목'이 그 노래가 맞는지 확인해 주세요.`;
    updateBlocklistInfo();
  }

  document.getElementById('check-start').onclick = runCheck;
  document.getElementById('check-close').onclick = () => {
    if (checking) return alert('점검이 끝난 뒤에 닫아주세요.');
    document.getElementById('check-panel').style.display = 'none';
  };
  document.getElementById('check-reset-blocklist').onclick = () => {
    if (checking) return alert('점검이 끝난 뒤에 눌러주세요.');
    if (!confirm('지금까지 재생 실패로 자동 제외된 곡 목록을 전부 초기화할까요?')) return;
    badIds.clear();
    persistBadIds();
    updateBlocklistInfo();
  };
  function updateBlocklistInfo() {
    document.getElementById('check-blocklist-info').innerText = `현재 자동 제외된 곡: ${badIds.size}개`;
  }
  updateBlocklistInfo();
</script>
<!-- 콜백 함수를 먼저 정의한 뒤에 유튜브 API를 불러옴 -->
<script src="https://www.youtube.com/iframe_api"></script>
</body>
